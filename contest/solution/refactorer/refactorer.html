<html>
	<head>
		<title>Refactorer</title>
		<style>
			h3, h4 {
				font-family: Calibri, sans-serif;
			}

			pre, code {
				font-family: consolas, monospace;
			}

			.fileLabel {
				display: inline-block;
				padding: 10px;
				border: solid 1px #222;
			}

			.propertyHighlight {
				background-color: yellow;
			}

			.callGraphOuter {
				border: solid 1px #222;
				padding: 10px;
			}

			.callGraphChildren {
				display: flex;
			}
		</style>
	</head>
	<body>
		<script>
			function toggleExperiments() {
				$container.style.display = $container.style.display === 'none' ? '' : 'none';
			}
		</script>
		<button onclick="toggleExperiments()">Toggle experiments</button>
		<div id="$container" style="height: 20vh;"></div>

		<script src="./myCpp_rules.js"></script>
		<script src="https://unpkg.com/monaco-editor@0.52.2/min/vs/loader.js"></script>
		<script>
			// Based on:
			// https://stackoverflow.com/questions/73698181/embed-a-vscode-style-ide-in-the-browser
			// https://stackoverflow.com/a/73698869/7788315
			require.config({ paths: { 'vs': "https://unpkg.com/monaco-editor@0.52.2/min/vs" } });
		</script>
		<script src="https://unpkg.com/monaco-editor@0.52.2/min/vs/editor/editor.main.nls.js"></script>
		<script src="https://unpkg.com/monaco-editor@0.52.2/min/vs/editor/editor.main.js"></script>
		
		<script type="module">
			import { onCleanup, createSignal, createEffect, createMemo, For } from "https://esm.sh/solid-js@1.8.1";
			import { render } from "https://esm.sh/solid-js@1.8.1/web";
			import html from "https://esm.sh/solid-js@1.8.1/html";
			

			const $container = document.getElementById('$container');

			
			const myCppTheme = 'myCppTheme';
			monaco.editor.defineTheme(myCppTheme, {
				base: 'vs',
				inherit: true,
				colors: {
					'editor.foreground': '#000000',
				},
				rules: [
					{ token: 'targetProperty', foreground: 'ff0000', fontStyle: 'bold underline' },
					// { token: 'custom-info', foreground: '808080' },
					// { token: 'custom-error', foreground: 'ff0000', fontStyle: 'bold' },
					// { token: 'custom-notice', foreground: 'FFA500' },
					// { token: 'custom-date', foreground: '008800' },
				]
			});
			// ^ https://stackoverflow.com/questions/52700307/how-to-use-monaco-editor-for-syntax-highlighting : https://stackoverflow.com/a/63219877/7788315

			const cache = {};
			function languageVariant(targetProperty) {
				if (!cache[targetProperty]) {
					const res = {
						name: 'myCpp_' + targetProperty,
						definition: {
							...myCppRules.language,
							toHighlight: [targetProperty],
						},
					};
					cache[targetProperty] = res;

					monaco.languages.register({ id: res.name });
					monaco.languages.setMonarchTokensProvider(res.name, res.definition);

				}
				
				return cache[targetProperty];
			}

			const zhukLanguage = languageVariant('Zhuk');

			monaco.editor.setTheme(myCppTheme);
			var diffEditor = monaco.editor.createDiffEditor(
				$container,
				{
					// language: zhukLanguage.name,
					// theme: myCppTheme,
				}
			);
			// diffEditor.setModelLanguage(zhukLanguage.name);
			// var diffEditorModel = diffEditor.getModel(); // we'll create a model for you if the editor created from string value.

			let originalModel, modifiedModel;
			diffEditor.setModel({
				original: (originalModel = monaco.editor.createModel('1\n2\n3', 'python')),
				modified: (modifiedModel = monaco.editor.createModel('1\n5\n3\nZhuk\nLLLLLLZhuk\nZhuk123', 'python')),
			});
			
			monaco.editor.setModelLanguage(originalModel, zhukLanguage.name);
			monaco.editor.setModelLanguage(modifiedModel, zhukLanguage.name);


			// monaco.languages.register({ id: zhukLanguage.name });
			// // Following rules are used to color / syntax highlight
			// monaco.languages.setMonarchTokensProvider(zhukLanguage.name, zhukLanguage.definition);
			


			function postpone(f) {
				setTimeout(f, 1000);
			}
			
			postpone(() => {
			});


			let [files, setFiles] = createSignal([]);
			let [property, setProperty] = createSignal('');

			let propertyType = () => property().split(' ').slice(0, -1).join(' ').trim();
			let propertyName = () => property().split(' ').at(-1);
			let propertyValid = () => (propertyType() && propertyName() && true);
			/* {
				name: '',
				handle: null,
				code: '',
				lines: [],
			} */
			let $property = null;


			let patchingInfo = {};

			// let handle = null;

			async function openFiles() {
				const handles = await window.showOpenFilePicker({ multiple: true });

				const newFiles = [];
				for (const handle of handles) {
					const fileObj = await handle.getFile();
					console.log('file:', fileObj);

					const code = await fileObj.text();
					const lines = code.split('\n');
					
					newFiles.push({
						name: fileObj.name,
						handle,
						code,
						lines,
					});
				}

				patchingInfo = {};
				setFiles([...files(), ...newFiles]);
			};

			async function reloadFiles() {
				const nextFiles = [];

				for (const file of files()) {
					const fileObj = await file.handle.getFile();
					const code = await fileObj.text();
					const lines = code.split('\n');

					nextFiles.push(code === file.code ? file : {
						...file,
						code,
						lines,
					});
				}

				patchingInfo = {};
				setFiles(nextFiles);
			};

			async function patch() {
				let patchedSomething = false;

				const nextFiles = [];

				for (const file of files()) {
					const info = patchingInfo[file.name];
					if (!info) {
						nextFiles.push(file);
						continue;
					}

					let patchedCode = '';

					let prevEndLine = 0;
					for (const { func, originalModel, modifiedModel } of info) {
						patchedCode += file.lines.slice(prevEndLine, func.startLine).join('\n');
						const modifiedCode = modifiedModel.getValue();
						patchedCode += '\n' + modifiedCode + '\n';

						prevEndLine = func.endLine;
					}
					const rest = file.lines.slice(prevEndLine).join('\n');
					patchedCode += rest;
					
					if (patchedCode !== file.code) {
						const writable = await file.handle.createWritable();
						await writable.write(patchedCode);
						await writable.close();

						// console.log(patchedCode);
						window.patchedCode = patchedCode;
						patchedSomething = true;

						// for (const { func, originalModel, modifiedModel } of info) {
						// 	modifiedModel.setValue(originalModel.getValue());
						// }

						// break;
					}

					nextFiles.push(patchedCode === file.code ? file : {
						...file,
						code: patchedCode,
						lines: patchedCode.split('\n'),
					});
				}

				if (!patchedSomething) {
					alert('Nothing patched');
				}
				console.log('patchedSomething:', patchedSomething);

				setFiles(nextFiles);
			};

			let allFunctions = createMemo(() => {
				let functions = [];
				// {
					// 	name,
					//	file,
					// 	startLine,
					// 	endLine,
				// };

				for (const file of files()) {
					let lastFunction = null;
					let lineI = 0;
					for (let line of file.lines) {
						const functionRegex = /ContestValidateQuery::(?<name>[^\(]+)\(/;
						const functionEndRegex = /^}\s*$/;
	
						const match = line.match(functionRegex);
						if (match && !/\s/.test(line[0])) { // Trust that function definitions don't start with whitespace
							if (lastFunction) {
								alert('Function without end found:', lastFunction);
								console.error('Function without end found:', lastFunction);
							}
							lastFunction = {
								file,
								name: match.groups.name,
								startLine: lineI,
							};
							functions.push(lastFunction);
						}
						if (functionEndRegex.test(line)) {
							if (lastFunction) { // Because functions which are not ContestValidateQuery:: are not included, but there end is found
								lastFunction.endLine = lineI + 1;
								lastFunction.code = file.lines.slice(lastFunction.startLine, lastFunction.endLine).join('\n');
								lastFunction = null;
							}
						}
	
						lineI++;
					}

					if (lastFunction) {
						alert('Function without end found:', lastFunction);
						console.error('Function without end found:', lastFunction);
					}
				}
				
				const badFuncs = functions.filter(func => !func.endLine);
				if (badFuncs.length > 0) {
					alert('Some functions are missing an end line, list in the console');
					console.error('Bad functions:', badFuncs);
				}

				const overloadCount = {};
				for (const func of functions) {
					overloadCount[func.name] = (overloadCount[func.name] ?? 0) + 1;
				}
				functions = functions.filter(func => overloadCount[func.name] === 1 && func.name !== 'ContestValidateQuery');
				// Remove overloaded functions: those are functions like reject_throw, fatal_throw, etc.
				// They don't help to understand the big picture
				
				return functions;
			});

			function analyzeProperty(name) {
				return allFunctions().filter(func => func.code.includes(name));
			}

			const calls = createMemo(() => {
				const functions = allFunctions();
				const calling = {};
				const calledFrom = {};

				for (const inner of functions) {
					const regex = new RegExp(`\\b${inner.name}\\b`, 'g');
					for (const outer of functions) {
						if (outer !== inner && regex.test(outer.code)) {
							calling[outer.name] = [...(calling[outer.name] ?? []), inner];
							calledFrom[inner.name] = [...(calledFrom[inner.name] ?? []), outer];
						}
					}
				}

				return { calling, calledFrom };
			});

			const roots = createMemo(() => allFunctions().filter(func => !calls().calledFrom[func.name]));

			const circularDependencies = createMemo(() => {
				const functions = allFunctions();
				const calling = calls().calling;

				const visited = {};
				let stack = {};

				function dfs(func) {
					if (visited[func.name]) {
						if (stack[func.name]) {
							return [func];
						}
						return [];
					}

					visited[func.name] = true;
					stack[func.name] = true;

					const children = calling[func.name] ?? [];
					for (const child of children) {
						const cycle = dfs(child);
						if (cycle.length > 0) {
							return [func, ...cycle];
						}
					}

					stack[func.name] = false;
					return [];
				}

				const cycles = [];
				for (const func of functions) {
					const cycle = dfs(func);
					if (cycle.length > 0) {
						cycles.push(cycle);
						stack = {};
					}
				}

				return cycles;
			});

			createEffect(() => {
				console.log('files:', files());
				console.log('roots:', roots());
				console.log('calls:', calls());
				console.log('circularDependencies:', circularDependencies());
			});

			const CallGraph = () => {


				function dfs(func) {
					// console.log(func);
					const children = calls().calling[func.name] ?? [];

					return html`<div class="callGraphOuter">
						${func.name}
						<div class="callGraphChildren">
							<${For} each=${() => children}>${child => dfs(child)}</For>
						</div>
					</div>`;
				}

				return html`<div>
					<h3>Call Graph ${() => files().length}</h3>
						<${For} each=${() => roots()}>${root => dfs(root)}</For>
					</div>`;
			};
	  
			const App = () => {
				return html`<div>
					<span>
						<${For} each=${() => files()}>${file => html`
							<span class="fileLabel">
								${file.name}
								<button onClick=${() => setFiles(files().filter(f => f !== file))}>-</button>
							</span>`
						}</For>
					</span>
					<button onClick=${openFiles}>Open File(s)</button>
					<button onClick=${reloadFiles}>Reload Files</button>
					Property: <input id="$property" /> <button onClick=${() => setProperty($property.value.trim())}>Analize</button>
					<div><pre>
						Type: ${() => propertyType()} <br />
						Name: <b>${() => propertyName()}</b> <br />
						${() => (!propertyValid() && 'Property invalid')}
					</pre></div>
					${() => html`<${CallGraph} />`}

					${() => (propertyName() && html`<div>
						<${For} each=${() => analyzeProperty(propertyName())}>${func => {
							const file = func.file;
							patchingInfo[file.name] = patchingInfo[file.name] ?? [];
	
							const language = languageVariant(propertyName());

							const de = document.createElement('div');
							de.style.height = '70vh';

							const functionCode = file.lines.slice(func.startLine, func.endLine).join('\n');
							let originalModel= monaco.editor.createModel(functionCode, language.name);
							let modifiedModel = monaco.editor.createModel(functionCode, language.name);

							patchingInfo[func.file.name].push({
								func,
								originalModel,
								modifiedModel,
							});

							setTimeout(() => {
								// https://github.com/microsoft/monaco-editor/blob/35eb0efbc039827432002ccc17b120eb0874d70f/samples/browser-amd-diff-editor/index.html
								var diffEditor = monaco.editor.createDiffEditor(de,
									{
										language: language.name,
										theme: myCppTheme,
									}
								);
								diffEditor.setModel({ original: originalModel, modified: modifiedModel,});
							}, 100);

							return html`
							<div>
								<h4>${func.file.name}: ${func.name}</h4>
								${de}
							</div>`
						}}</For>
						<hr />
						<button onclick=${patch}>Patch</button>
					</div>`)}
					
				</div>`;
			};
			render(App, document.body);

			$property = document.getElementById('$property');


										// <pre>
										// 	<code innerHTML=${codeLines.slice(func.startLine, func.endLine+1).join('\n')
										// 		.replaceAll(
										// 			new RegExp(`([^a-zA-Z0-9_])${propertyName()}([^a-zA-Z0-9_])`, 'g'),
										// 			`$1<span class="propertyHighlight">${propertyName()}</span>$2`,
										// 		)
										// 	}></code>
										// </pre>



			// const $openFile = document.getElementById('openFile');
			// const $addZhuk = document.getElementById('addZhuk');
			// const $contents = document.getElementById('contents');
			
			/*
			${() => files().map(file => html`<span class="fileLabel">
							${file.name}
							<button onClick=${() => setFiles(files().filter(f => f !== file))}>-</button>
						</span>
			*/
		</script>
	</body>
</html>

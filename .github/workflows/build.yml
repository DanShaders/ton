name: TON Build

on: [push]

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  PREFIX: ${{ github.workspace }}/prefix # used in setup action

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          # - os: macos-13
          #   type: portable
          # - os: macos-13
          #   type: shared
          # - os: macos-14
          #   type: portable
          # - os: macos-14
          #   type: shared
          # - os: macos-15
          #   type: portable

          - os: ubuntu-20.04
            type: portable
          - os: ubuntu-22.04-arm
            type: portable

          - os: ubuntu-20.04
            type: shared
          - os: ubuntu-22.04
            type: shared
          - os: ubuntu-22.04-arm
            type: shared
          - os: ubuntu-24.04
            type: shared
          - os: ubuntu-24.04-arm
            type: shared

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          submodules: recursive

      - name: Setup CI machine
        uses: ./src/.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.type }}

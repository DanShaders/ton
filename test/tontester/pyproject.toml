[project]
name = "tontester"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dash",
    "fastapi",
    "httpx",
    "plotly",
    "pydantic",
    "pytoniq-core",
    "pyyaml",
    "types-pyyaml",
    "uvicorn[standard]",
    "watchfiles",
    "websockets",
]

[project.scripts]
consensus_explorer = "consensus_explorer.explorer:_main"
daemon = "daemon.cli:main"

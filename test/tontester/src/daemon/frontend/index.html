<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tontester dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>tontester dashboard</h1>
    </header>
    <main>
      <section>
        <div class="toolbar">
          <button id="overlay-btn" type="button" disabled>Overlay in Grafana</button>
          <span id="overlay-count" class="muted">0 selected</span>
        </div>
        <table id="runs">
          <thead>
            <tr>
              <th class="select-col"><input type="checkbox" id="select-all" /></th>
              <th>Run ID</th>
              <th>Status</th>
              <th>Started</th>
              <th>Ended</th>
              <th>Nodes</th>
              <th>Description</th>
              <th>Git</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
